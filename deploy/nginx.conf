# VilHil Studio — Nginx 反向代理配置
# 适用于阿里云 ECS + Nginx + Let's Encrypt / 阿里云 SSL 证书
#
# 放置路径：/etc/nginx/sites-available/vilhil-studio
# 启用命令：ln -s /etc/nginx/sites-available/vilhil-studio /etc/nginx/sites-enabled/
# 重载命令：nginx -t && systemctl reload nginx

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    listen [::]:80;
    server_name studio.vilhil.cn;

    # Let's Encrypt ACME challenge（certbot 用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.vilhil.cn;

    # ── SSL 证书 ────────────────────────────────────────────────────
    # 阿里云 SSL：下载 Nginx 证书包后上传到服务器
    ssl_certificate     /etc/nginx/ssl/studio.vilhil.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/studio.vilhil.cn.key;

    # 现代 TLS 配置（兼容 IE11+ / 主流移动端）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── 请求大小限制（对应 Next.js serverActions bodySizeLimit）────
    client_max_body_size 110m;

    # ── 超时配置（3D 资源加载可能较慢）─────────────────────────────
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    # ── Next.js 反向代理 ────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket 支持（Next.js HMR / 未来 WS 功能）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 透传真实 IP（rate limiter 用）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        proxy_cache_bypass $http_upgrade;
    }

    # ── 静态资源缓存（Next.js _next/static 目录）────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── 日志 ────────────────────────────────────────────────────────
    access_log /var/log/nginx/vilhil-studio.access.log;
    error_log  /var/log/nginx/vilhil-studio.error.log warn;
}
